name: Generate Kalam SEO Pages

on:
  workflow_dispatch:

  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SEO pages and sitemap
        run: node scripts/generate-seo-pages.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Save generated pages and sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seo-kalam sitemap.xml

          if git diff --cached --quiet; then
            echo "No changes found."
          else
            git commit -m "Generate Kalam SEO pages and sitemap"
            git push
          fi